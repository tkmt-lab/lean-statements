name: Check Lean statements

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      LEAN_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Source and claim correspondence
        run: |
          python3 -B tools/check.py --static-only
          python3 -B tools/check_claims.py
      - name: Restore Lean and dependency cache
        id: dependencies
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.elan
            .lake/packages
          key: ${{ runner.os }}-${{ runner.arch }}-lean-statements-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - name: Install elan
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl -sSfL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Obtain prebuilt Mathlib
        run: lake exe cache get
      # Save dependencies before statement checking; a failed check must not
      # discard a successful, fixed-version Mathlib download.
      - name: Save Lean and dependency cache
        if: steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.elan
            .lake/packages
          key: ${{ steps.dependencies.outputs.cache-primary-key }}
      - name: Check all nine statements with explicit memory bounds
        run: |
          lake --no-build --no-cache build +Mathlib +Qq
          python3 -B tools/check.py --lean-memory-mib 8192 --rss-limit-mib 10240 --evidence .build/ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: statement-build
          path: .build/ci/
